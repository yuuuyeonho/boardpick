spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

app:
  frontend-url: ${FRONTEND_URL:http://localhost:5174}
  google:
    client-id: ${GOOGLE_CLIENT_ID}

server:
  port: 8080

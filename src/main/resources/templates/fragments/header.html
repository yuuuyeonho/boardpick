<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:fragment="header">
    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-
 to-fit=no">
    <link rel="stylesheet" href="/css/style.css">
    <title>boarPICK 보드게임 랜덤 추천</title>

    <!-- 네비게이션 바 스타일 -->
    <style>
        /* 네비게이션 바 스타일 */
        nav ul {
            list-style-type: none; /* 기본 불릿 스타일 제거 */
            padding: 0;
            margin: 0;
            display: flex; /* 가로로 정렬 */
        }

        nav ul li {
            margin-right: 20px; /* 항목 간격 조절 */
        }

        nav ul li a {
            text-decoration: none; /* 밑줄 제거 */
            color: black; /* 링크 색상 */
            padding: 10px 15px;
            font-weight: bold;
        }

        nav ul li a:hover {
            color: #3498db; /* 마우스 올렸을 때 색상 변화 */
        }
    </style>
</head>

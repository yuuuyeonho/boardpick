<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/header :: header" />
<body>
<div class="container">
    <!-- 헤더: 로그인과 회원가입 버튼 -->
    <div th:replace="fragments/bodyHeader :: bodyHeader"/>
    <!-- 메인 콘텐츠: 게임 리스트 -->
    <main>
        <form role="form" th:action="@{/games/new}" th:object="${form}" method="post">
            <div class="form-field">
                <label th:for="name">이름</label>
                <input type="text" th:field="*{name}" class="input"
                       placeholder="이름을 입력하세요"
                       th:class="${#fields.hasErrors('name')}? 'form-controlfieldError' : 'input'">
                <p th:if="${#fields.hasErrors('name')}"
                   th:errors="*{name}">Incorrect date</p>
            </div>
            <div class="form-field">
                <label th:for="minPlayer">최소 인원수</label>
                <input type="number" th:field="*{minPlayer}" class="input"
                       placeholder="최소 인원"> </div>
            <div class="form-field">
                <label th:for="maxPlayer">최대 인원</label>
                <input type="number" th:field="*{maxPlayer}" class="input"
                       placeholder="최대 인원"> </div>
            <div class="form-field">
                <label th:for="category">카테고리</label>
                <input type="text" th:field="*{category}" class="input"
                       placeholder="카테고리를 입력하세요"> </div>
            <br/>
            <button type="submit" class="btn btn--primary">추가</button>
        </form>
        <br/>
    </main>
    <div th:replcae="~{fragments/footer :: footer}"></div>
</div>
</body>
</html>

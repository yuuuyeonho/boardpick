<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/header :: header" />
<body>
<div class="container">
    <!-- 헤더: 로그인과 회원가입 버튼 -->
    <div th:replace="fragments/bodyHeader :: bodyHeader"/>
    <!-- 메인 콘텐츠: 게임 리스트 -->
    <form role="form" th:action="@{/games/edit}" th:object="${gameForm}" method="post">
        <!-- id -->
        <input type="hidden" th:field="*{id}" />
        <div class="form-group">
            <label th:for="name">상품명</label>
            <input type="text" th:field="*{name}" class="form-control"
                   placeholder="이름을 입력하세요" /> </div>
        <div class="form-group">

            <label th:for="minPlayer">최소 인원</label>
            <input type="number" th:field="*{minPlayer}" class="form-control"
                   placeholder="최소 인원" /> </div>
        <div class="form-group">
            <label th:for="maxPlayer">최대 인원</label>
            <input type="number" th:field="*{maxPlayer}" class="form-control"
                   placeholder="최대 인원" /> </div>
        <div class="form-group">
            <label th:for="author">카테고리</label>
            <input type="text" th:field="*{category}" class="form-control"
                   placeholder="카테고리" /> </div>
        <br/>
        <button type="submit" class="btn btn-primary">수정</button>
    </form>
    <div th:replcae="~{fragments/footer :: footer}"></div>
</div>
</body>
</html>

<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/header :: header" />
<style>
    .fieldError {
        border-color: #bd2130;
    }
</style>
<body>
<div class="container">
    <div th:replace="fragments/bodyHeader :: bodyHeader"/>
    <form role="form" th:action="@{/users/signup}" th:object="${userForm}" method="post">
        <div th:replace="~{fragments/formErrors :: formErrorsFragment}"></div>

        <div class="form-group mb-3">
            <label th:for="username">사용자ID</label>
            <input type="text" th:field="*{username}" class="input"
                   placeholder="이름을 입력하세요"
                   th:class="${#fields.hasErrors('username')}? 'form-controlfieldError' : 'form-control'">
            <p th:if="${#fields.hasErrors('username')}" th:errors="*{username}">Incorrect date</p>
        </div>
        <div class="form-group mb-3">
            <label th:for="displayName">표시 이름</label>
            <input type="text" th:field="*{displayName}" class="input" placeholder="고객에게 보일 이름 또는 공간 이름">
        </div>
        <div class="form-group mb-3">
            <label th:for="password1">비밀번호</label>
            <input type="text" th:field="*{password1}" class="input" placeholder="비밀번호를 입력하세요"
                   th:class="${#fields.hasErrors('password1')}? 'form-controlfieldError' : 'form-control'">
            <p th:if="${#fields.hasErrors('password1')}" th:errors="*{password1}">Incorrect date</p>
        </div>
        <div class="form-group mb-3">
            <label th:for="password2">비밀번호 확인</label>
            <input type="text" th:field="*{password2}" class="input" placeholder="비밀번호 확인">
        </div>
        <button type="submit" class="btn btn--primary">회원가입</button>
    </form>
    <br/>

    <div th:replace="fragments/footer :: footer" />
</div> <!-- /container -->
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.w3.org/1999/xhtml">
<head th:replace="fragments/header :: header" />
<body>
<div class="container">
<!-- 헤더: 로그인과 회원가입 버튼 -->
<div th:replace="fragments/bodyHeader :: bodyHeader"/>
    <!-- 메인 콘텐츠: 게임 리스트 -->
    <main>
        <h2>추천 보드게임 목록</h2>
        <div class="game-list">
            <table class="game-table">
                <thead>
                <tr>
                    <th>#</th>
                    <th>게임 이름</th> <th>적정 인원</th> <th>카테고리</th>
                    <th></th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="game : ${games}">
                    <td th:text="${gameStat.count}"></td>
                    <td th:text="${game.name}"></td>
                    <td th:text="${game.minPlayer} + '~' + ${game.maxPlayer}"></td>
                    <td th:text="${game.category}"></td>

<!--                    <td>-->
<!--                        <a th:if="${item.status.name() == 'ORDER'}" href="#"-->
<!--                           th:href="'javascript:cancel('+${item.id}+')'"-->
<!--                           class="btn btn-danger">CANCEL</a>-->
<!--                    </td>-->
                </tr>
                </tbody>
            </table>
        </div>
        <a th:href="@{/games/pick}" class="btn btn--primary">게임 추천</a>
        <a a sec:authorize="isAuthenticated()" th:href="@{/games}" class="btn btn--primary">list 편집</a>
    </main>
    <div th:replcae="~{fragments/footer :: footer}"></div>
</div>
</body>
</html>
